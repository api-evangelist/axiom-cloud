aid: axiom-cloud

name: Axiom Cloud

description: Axiom Cloud provides a suite of blockchain-based trading and settlement services, offering APIs for on‑chain asset management, market
  data, and automated trading. The platform aims to simplify decentralized finance integration for developers and enterprises, delivering secure,
  scalable, and compliant solutions across multiple blockchain networks. It supports real‑time data feeds, order execution, and portfolio analytics
  through RESTful endpoints and WebSocket streams.

